<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah - Test Version</title>
    
    <!-- أيقونات السوشيال ميديا -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ========================================== -->
    <!-- هنا بداية كود الـ CSS (التصميم) -->
    <!-- ========================================== -->
    <style>
        /* 1. إعدادات عامة للصفحة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        /* 2. لون الخلفية الأخضر */
        body {
            background-color: #1e9e5e; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 3. الكارت الأبيض اللي في النص */
        .card-container {
            background-color: #ffffff; 
            width: 100%;
            max-width: 400px; 
            border-radius: 20px; 
            padding: 60px 30px 30px 30px; 
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
            margin-top: 40px;
        }

        /* 4. الصورة الشخصية (اللي طالعة فوق) */
        .profile-pic {
            position: absolute;
            top: -50px; 
            left: 50%;
            transform: translateX(-50%);
            width: 100px; 
            height: 100px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%; /* عشان يظبط وش عبدالله في النص */
        }

        /* 5. الاسم */
        .name {
            font-size: 26px;
            color: #333;
            margin-bottom: 5px;
            font-weight: 600;
        }

        /* 6. الوصف (WhatsApp contact) */
        .description {
            font-size: 16px;
            color: #777;
            margin-bottom: 25px;
        }

        /* 7. الـ QR Code */
        .qr-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .qr-container img {
            width: 200px; 
            height: 200px;
            border-radius: 10px;
        }

        /* 8. النص اللي تحت الـ QR */
        .scan-text {
            font-size: 13px;
            color: #999;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* 9. حاوية أزرار السوشيال ميديا */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px; 
            flex-wrap: wrap;
        }

        /* 10. شكل الزرار نفسه */
        .btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #fff;
            font-size: 20px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        /* 11. ألوان الأزرار */
        .whatsapp { background-color: #25D366; }
        .facebook { background-color: #1877F2; }
        .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .tiktok { background-color: #000000; }
    </style>
</head>
<body>

    <div class="card-container">
        
        <!-- الصورة الشخصية (تم تحديثها بصورتك) -->
        <div class="profile-pic">
            <img src="https://i.ibb.co/3k6q6vB/abdullah.jpg" alt="Abdullah Profile">
        </div>

        <h1 class="name">Abdullah</h1>
<p class="description" style="color: #5484b4; font-weight: bold; margin-bottom: 25px;">
    Welcome to my small world 
</p> 
        
        <!-- الوصف -->
        <p class="description">WhatsApp contact</p>

        <!-- الـ QR Code -->
        <div class="qr-container">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://wa.me/qr/LHBDTVRAW6YMJ1" alt="WhatsApp QR Code">
        </div>

        <!-- النص التحتاني -->
        <p class="scan-text">Scan this code using the WhatsApp camera to get my number</p>

        <!-- الأزرار -->
        <div class="social-links">
            <a href="https://wa.me/qr/LHBDTVRAW6YMJ1" target="_blank" class="btn whatsapp"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.facebook.com/abdalla.shady.75?sfnsn=scwspwa&mibextid=RUbZ1f" target="_blank" class="btn facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/invites/contact/?utm_source=ig_contact_invite&utm_medium=copy_link&utm_content=ucfqs6m" target="_blank" class="btn instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@_say_my_name_1?_r=1&_t=ZS-9AkQg2pZjOv" target="_blank" class="btn tiktok"><i class="fab fa-tiktok"></i></a>
        </div>

    </div>

</body>
</html>
